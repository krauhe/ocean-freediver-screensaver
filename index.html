<!-- Standalone 3D screensaver. Open this file directly; all resources are local. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#031b35">
  <title>Hammerheads · The Blue Deep</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="ocean.css">
</head>
<body>
  <main id="ocean" aria-label="3D screensaver with sharks and jellyfish in a deep blue ocean">
    <canvas id="scene" role="img" aria-label="Sharks and jellyfish swim slowly among sunbeams and drifting particles in the ocean."></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div id="loading" role="status">Diving below the surface …</div>
    <div id="error" role="alert" hidden></div>
    <footer class="chrome">
      <nav class="controls" aria-label="Screensaver controls">
        <button id="pause" type="button" title="Space" aria-label="Pause animation" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M9 5v14M15 5v14"/></svg>
          <span id="pause-label">Pause</span>
        </button>
        <label class="speed" title="Swimming speed">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h10c5 0 5-6 1-6M3 13h16M3 17h8c5 0 5 5 1 5"/></svg>
          <input id="speed" type="range" min="0.3" max="1.6" step="0.1" value="0.7" aria-label="Swimming speed">
        </label>
        <button id="fullscreen" type="button" title="F · Double-click the open water">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
          <span>Fullscreen</span>
        </button>
        <div class="count-controls">
          <label class="population-count" for="animal-count" title="Total animals, shared between the selected species">
            <span>Animals <output id="animal-count-value" for="animal-count">30</output></span>
            <input id="animal-count" type="range" min="0" max="40" step="1" value="30" aria-label="Number of animals">
          </label>
          <label class="population-count" for="particle-count" title="Number of suspended particles in the water">
            <span>Particles <output id="particle-count-value" for="particle-count">1700</output></span>
            <input id="particle-count" type="range" min="0" max="5000" step="100" value="1700" aria-label="Number of particles">
          </label>
        </div>
        <div class="species-controls" role="group" aria-labelledby="species-label">
          <span id="species-label">Species</span>
          <label><input type="checkbox" name="species" value="hammerhead" checked> Hammerhead</label>
          <label><input type="checkbox" name="species" value="greatwhite" checked> Great white</label>
          <label><input type="checkbox" name="species" value="jellyfish" checked> Jellyfish</label>
        </div>
        <div class="day-controls">
          <label for="time-mode">Lighting</label>
          <select id="time-mode" aria-label="Lighting time mode">
            <option value="clock">Local clock</option>
            <option value="custom">Custom time</option>
          </select>
          <label class="time-slider" for="light-time">
            <span class="time-endpoint" aria-hidden="true">00:00</span>
            <input id="light-time" type="range" min="0" max="1439" step="1" value="720" aria-label="Time of day" aria-valuetext="12:00">
            <span class="time-endpoint" aria-hidden="true">23:59</span>
          </label>
          <output id="light-time-value" for="light-time" aria-label="Selected time">12:00</output>
        </div>
      </nav>
    </footer>
    <p class="chrome hint">Left: push · Right: pull · Grab away from the centre to turn</p>
    <div id="notice" role="status" aria-live="polite"></div>
  </main>
  <noscript>Enable JavaScript in your browser to view the animated screensaver.</noscript>
  <script src="three.min.js"></script>
  <script src="jellyfish.js"></script>
  <script src="ocean.js"></script>
</body>
</html>
